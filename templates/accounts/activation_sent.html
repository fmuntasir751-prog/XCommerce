{% extends "base.html" %}

{% block title %}Activate Account | XCommerce{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-card text-center">
        <h1 class="fw-bold">Check Your Email</h1>

        <p class="text-secondary">
            We sent an activation link to your email address.
            Open the link to activate your account.
        </p>

        <a
            href="{% url 'accounts:login' %}"
            class="btn btn-outline-dark"
        >
            Go to Login
        </a>
    </div>
</section>
{% endblock %}
