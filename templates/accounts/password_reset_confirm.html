{% extends "base.html" %}

{% block title %}Set New Password | XCommerce{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-card">
        {% if validlink %}
            <h1 class="fw-bold text-center">Set New Password</h1>

            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}

                <button class="btn btn-warning w-100" type="submit">
                    Change Password
                </button>
            </form>
        {% else %}
            <h1 class="fw-bold text-center">Invalid Link</h1>

            <p class="text-center">
                This password reset link is invalid or has expired.
            </p>
        {% endif %}
    </div>
</section>
{% endblock %}
