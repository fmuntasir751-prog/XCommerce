databases:
  - name: xcommerce-db
    plan: free
    databaseName: xcommerce
    user: xcommerce_user

services:
  - type: web
    name: xcommerce
    runtime: python
    plan: free

    buildCommand: bash build.sh

    startCommand: >-
      python -m gunicorn
      config.asgi:application
      -k uvicorn.workers.UvicornWorker

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: xcommerce-db
          property: connectionString

      - key: DJANGO_SECRET_KEY
        generateValue: true

      - key: DJANGO_DEBUG
        value: "False"

      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"

      - key: WEB_CONCURRENCY
        value: "2"

      - key: STRIPE_PUBLISHABLE_KEY
        sync: false

      - key: STRIPE_SECRET_KEY
        sync: false

      - key: DJANGO_EMAIL_HOST
        value: "smtp.gmail.com"

      - key: DJANGO_EMAIL_PORT
        value: "587"

      - key: DJANGO_EMAIL_USER
        sync: false

      - key: DJANGO_EMAIL_PASSWORD
        sync: false

      - key: DJANGO_DEFAULT_FROM_EMAIL
        sync: false